# CSPdocMaker on a server. See DEPLOY.md.
#
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env.production up -d --build
#
# Only Caddy is reachable from outside. Two ways to run it (set by
# deploy/make-env.sh):
#   * own domain   — Caddy takes ports 80/443 and gets the HTTPS certificate
#                    for DOMAIN itself (deploy/Caddyfile);
#   * behind a web server that already owns the domain, under a path such
#     as https://indev.eko.in/csp-docmaker — Caddy listens on HTTP_BIND
#     (127.0.0.1:8088) and that web server forwards BASE_PATH to it
#     (deploy/Caddyfile.behind-proxy, DEPLOY.md).
# The database and Redis are never exposed.

# One image for api, worker and beat. Only "api" builds it: three services
# building the same image at once collide ("image ... already exists").
x-backend: &backend
  image: cspdocmaker-backend
  pull_policy: never
  restart: unless-stopped
  env_file: deploy/.env.production
  environment:
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    LOG_DIR: /app/backend/logs
    # Paths inside the container — fixed here so a value copied from a
    # laptop's .env cannot point somewhere that does not exist.
    DOCUMENT_TEMPLATES_DIR: /app/templates/documents
    DOCUMENT_OUTPUT_DIR: /app/backend/generated_documents
    LIBREOFFICE_PATH: ""
    GOOGLE_SHEETS_CREDENTIALS_FILE: /app/backend/credentials/google_service_account.json
    GMAIL_CREDENTIALS_FILE: /app/backend/credentials/gmail_service_account.json
    # Every document as a file, one folder per CSP code (No. 105): the
    # `documents` folder next to this file, on the server itself.
    DOCUMENTS_ARCHIVE_DIR: /app/documents
  volumes:
    - ./backend/credentials:/app/backend/credentials:ro
    - ./documents:/app/documents
    - documents:/app/backend/generated_documents
    - logs:/app/backend/logs
    - models:/app/backend/app/assets/models
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cspdocmaker}
      POSTGRES_USER: ${DATABASE_USER:-cspdocmaker}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in deploy/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cspdocmaker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    <<: *backend
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    <<: *backend
    command: ["beat"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH:-}
    image: cspdocmaker-frontend
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env.production}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  documents:
  logs:
  models:
  caddy_data:
  caddy_config:
