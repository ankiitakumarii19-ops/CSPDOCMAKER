<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSPdocMaker | Eko Financial Infrastructure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        eko: {
                            DEFAULT: '#00B259',
                            dark: '#00964b',
                            light: '#e6f7ef',
                        },
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        /* Custom scrollbar for enterprise feel */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        [x-cloak] { display: none !important; }
    </style>
</head>

<body x-data="appState()" :class="{ 'dark': theme === 'dark' }" class="font-sans antialiased text-gray-800 bg-gray-50 dark:bg-navy-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col">

    <!-- MAIN APP CONTAINER -->
    <div class="flex-grow flex flex-col h-screen overflow-hidden">
        
        <!-- ========================================== -->
        <!-- AUTHENTICATION VIEW -->
        <!-- ========================================== -->
        <template x-if="currentRoute === 'auth'">
            <div class="flex h-full w-full">
                <!-- Left: Branding Graphic (Hidden on mobile) -->
                <div class="hidden lg:flex w-1/2 bg-navy-900 relative items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 opacity-20">
                        <svg class="h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,100 C30,60 70,60 100,0 L100,100 Z" fill="#00B259"></path></svg>
                    </div>
                    <div class="relative z-10 text-center px-12">
                        <div class="flex items-center justify-center gap-3 mb-6">
                            <div class="w-12 h-12 bg-eko rounded-lg flex items-center justify-center text-white text-2xl font-bold">E</div>
                            <h1 class="text-4xl font-bold text-white tracking-tight">CSPdocMaker</h1>
                        </div>
                        <p class="text-gray-300 text-lg max-w-md mx-auto">Financial Infrastructure for Bharat. Seamlessly manage and generate compliance documents for your Customer Service Points.</p>
                    </div>
                </div>

                <!-- Right: Auth Forms -->
                <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white dark:bg-gray-900">
                    <div class="w-full max-w-md">
                        <!-- Theme Toggle in Auth -->
                        <div class="absolute top-6 right-6">
                            <button @click="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-gray-500 dark:text-gray-400">
                                <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                            </button>
                        </div>

                        <!-- Header -->
                        <div class="text-center mb-8 lg:hidden">
                            <div class="flex items-center justify-center gap-2 mb-2">
                                <div class="w-8 h-8 bg-eko rounded border flex items-center justify-center text-white font-bold">E</div>
                                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">CSPdocMaker</h1>
                            </div>
                        </div>

                        <!-- Auth Tabs -->
                        <div class="flex space-x-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-xl mb-8">
                            <button @click="authTab = 'login'" :class="authTab === 'login' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'" class="w-1/2 py-2.5 text-sm font-medium rounded-lg transition-all">Login</button>
                            <button @click="authTab = 'register'" :class="authTab === 'register' ? 'bg-white dark:bg-gray-700 shadow-sm text-gray-900 dark:text-white' : 'text-gray-500 hover:text-gray-700 dark:hover:text-gray-300'" class="w-1/2 py-2.5 text-sm font-medium rounded-lg transition-all">Create Account</button>
                        </div>

                        <!-- Login Form -->
                        <div x-show="authTab === 'login'" x-transition.opacity>
                            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Welcome back</h2>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email Address</label>
                                    <input type="email" value="rm@eko.in" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko focus:border-eko dark:text-white outline-none transition-all" placeholder="name@eko.in">
                                </div>
                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Password</label>
                                        <a href="#" class="text-xs text-eko font-medium hover:underline">Forgot password?</a>
                                    </div>
                                    <input type="password" value="password" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko focus:border-eko dark:text-white outline-none transition-all" placeholder="••••••••">
                                </div>
                                
                                <div class="pt-2 flex gap-3">
                                    <button @click="login('rm')" class="w-1/2 py-2.5 bg-eko hover:bg-eko-dark text-white font-medium rounded-lg shadow-sm shadow-green-500/30 transition-all flex justify-center items-center gap-2">
                                        <span>Login as RM</span> <i class="fas fa-arrow-right text-xs"></i>
                                    </button>
                                    <button @click="login('admin')" class="w-1/2 py-2.5 bg-navy-800 hover:bg-navy-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-medium rounded-lg shadow-sm transition-all flex justify-center items-center gap-2">
                                        <span>Login Admin</span> <i class="fas fa-shield-alt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Register Form Simulation -->
                        <div x-show="authTab === 'register'" x-transition.opacity x-cloak>
                            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Create an account</h2>
                            
                            <div x-show="registerStep === 1">
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Official Email</label>
                                        <input type="email" class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none" placeholder="name@eko.in">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Select Role</label>
                                        <select class="w-full px-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none">
                                            <option>Relationship Manager (RM)</option>
                                            <option>Administrator</option>
                                        </select>
                                    </div>
                                    <button @click="registerStep = 2" class="w-full mt-4 py-2.5 bg-eko hover:bg-eko-dark text-white font-medium rounded-lg transition-all">Continue to OTP</button>
                                </div>
                            </div>

                            <div x-show="registerStep === 2" x-cloak>
                                <div class="space-y-4">
                                    <div class="p-3 bg-eko-light dark:bg-eko/10 text-eko-dark dark:text-eko rounded-lg text-sm mb-4">
                                        <i class="fas fa-check-circle mr-2"></i> Email domain verified.
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Enter OTP sent to email</label>
                                        <div class="flex gap-2">
                                            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none">
                                            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none">
                                            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none">
                                            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:ring-2 focus:ring-eko outline-none">
                                        </div>
                                    </div>
                                    <div class="flex gap-3 mt-6">
                                        <button @click="registerStep = 1" class="w-1/3 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 font-medium rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">Back</button>
                                        <button @click="login('rm')" class="w-2/3 py-2.5 bg-eko hover:bg-eko-dark text-white font-medium rounded-lg transition-all">Verify & Login</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </template>


        <!-- ========================================== -->
        <!-- RM DASHBOARD VIEW -->
        <!-- ========================================== -->
        <template x-if="currentRoute === 'rm'">
            <div class="flex flex-col h-full bg-gray-50 dark:bg-navy-900 w-full overflow-hidden">
                <!-- Global Top Nav -->
                <header class="h-16 bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 shrink-0 z-20">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-eko rounded flex items-center justify-center text-white font-bold text-sm">E</div>
                        <span class="font-bold text-lg hidden sm:block text-gray-900 dark:text-white">CSPdocMaker <span class="text-xs font-normal text-gray-500 bg-gray-100 dark:bg-gray-700 px-2 py-0.5 rounded ml-2">RM Portal</span></span>
                    </div>
                    <div class="flex items-center gap-4">
                        <!-- Notifications Dropdown -->
                        <div class="relative" @click.outside="alertsMenu = false">
                            <button @click="alertsMenu = !alertsMenu" class="relative text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 transition-colors">
                                <i class="far fa-bell text-xl"></i>
                                <span x-show="unreadAlerts > 0" class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full" x-text="unreadAlerts"></span>
                            </button>
                            
                            <!-- Dropdown Menu -->
                            <div x-show="alertsMenu" x-cloak class="absolute top-10 right-0 w-80 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 py-1 z-50">
                                <div class="px-4 py-2.5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                    <span class="font-bold text-sm text-gray-800 dark:text-white">Action Required</span>
                                    <span class="text-xs bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 px-2 py-0.5 rounded-full font-bold" x-text="unreadAlerts + ' New'"></span>
                                </div>
                                <div class="max-h-80 overflow-y-auto">
                                    <template x-for="alert in rmAlerts" :key="alert.id">
                                        <div @click="openAlert(alert)" class="px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer border-b border-gray-100 dark:border-gray-700 last:border-0 transition-colors" :class="!alert.read ? 'bg-orange-50/30 dark:bg-orange-900/10' : ''">
                                            <div class="flex justify-between items-start mb-1">
                                                <div class="font-bold text-sm text-gray-900 dark:text-white" x-text="alert.cspName"></div>
                                                <div class="text-xs font-semibold text-gray-500 bg-gray-100 dark:bg-gray-900 px-1.5 py-0.5 rounded" x-text="alert.cspId"></div>
                                            </div>
                                            <div class="text-xs text-orange-600 dark:text-orange-400 font-medium mt-1.5"><i class="fas fa-exclamation-triangle mr-1"></i> Missing: <span x-text="alert.missing"></span></div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        
                        <button @click="toggleTheme()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                            <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                        </button>
                        <div class="h-8 w-px bg-gray-200 dark:bg-gray-700 mx-2"></div>
                        <div class="flex items-center gap-3 cursor-pointer group relative" @click="logoutMenu = !logoutMenu" @click.outside="logoutMenu = false">
                            <div class="text-right hidden sm:block">
                                <div class="text-sm font-semibold text-gray-900 dark:text-white">Rahul Kumar</div>
                                <div class="text-xs text-gray-500">RM - Delhi NCR</div>
                            </div>
                            <div class="w-9 h-9 rounded-full bg-eko text-white flex items-center justify-center font-bold">RK</div>
                            <!-- Logout Dropdown -->
                            <div x-show="logoutMenu" x-cloak class="absolute top-12 right-0 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700 py-1">
                                <button @click="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                                    <i class="fas fa-sign-out-alt mr-2"></i> Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- RM Main Scrollable Area -->
                <main class="flex-grow overflow-y-auto p-4 sm:p-8">
                    <div class="max-w-5xl mx-auto space-y-6">

                        <!-- State 1: Dashboard & Search -->
                        <div x-show="rmStep === 'dashboard' || rmStep === 'search_result'">
                            
                            <!-- Search Bar -->
                            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-6">
                                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wider">Search CSP</label>
                                <div class="flex gap-3">
                                    <div class="relative flex-grow">
                                        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                        <input type="text" x-model="searchQuery" @keyup.enter="searchCSP()" class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:ring-2 focus:ring-eko focus:border-eko dark:text-white outline-none transition-all text-lg" placeholder="Enter CSP ID (e.g. CSP100234)">
                                    </div>
                                    <button @click="searchCSP()" class="px-6 py-3 bg-navy-800 hover:bg-navy-900 dark:bg-eko dark:hover:bg-eko-dark text-white font-medium rounded-lg shadow-sm transition-all whitespace-nowrap">
                                        Search
                                    </button>
                                </div>
                            </div>

                            <!-- Search Result / Details (Shown after search) -->
                            <div x-show="rmStep === 'search_result'" x-transition x-cloak>
                                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    
                                    <!-- Left Column: CSP Details Card -->
                                    <div class="lg:col-span-1 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                                        <div class="bg-gray-50 dark:bg-gray-900/50 p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
                                            <h3 class="font-semibold text-gray-900 dark:text-white"><i class="far fa-id-card text-eko mr-2"></i> CSP Details</h3>
                                            <span class="px-2 py-1 bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 text-xs rounded font-medium border border-green-200 dark:border-green-800">Active</span>
                                        </div>
                                        <div class="p-4 flex flex-col items-center border-b border-gray-200 dark:border-gray-700">
                                            <div class="w-20 h-20 bg-gray-200 dark:bg-gray-700 rounded-full mb-3 flex items-center justify-center overflow-hidden">
                                                <i class="fas fa-user text-3xl text-gray-400"></i>
                                            </div>
                                            <h4 class="font-bold text-lg text-gray-900 dark:text-white" x-text="mockCSP.name"></h4>
                                            <p class="text-sm text-gray-500 font-medium" x-text="mockCSP.id"></p>
                                        </div>
                                        <div class="p-4 space-y-3 text-sm">
                                            <div class="flex justify-between"><span class="text-gray-500">Branch</span> <span class="font-medium text-gray-900 dark:text-white text-right" x-text="mockCSP.branch"></span></div>
                                            <div class="flex justify-between"><span class="text-gray-500">Location</span> <span class="font-medium text-gray-900 dark:text-white text-right" x-text="mockCSP.location"></span></div>
                                            <div class="flex justify-between"><span class="text-gray-500">Mobile</span> <span class="font-medium text-gray-900 dark:text-white" x-text="mockCSP.mobile"></span></div>
                                            <div class="flex justify-between"><span class="text-gray-500">Email</span> <span class="font-medium text-gray-900 dark:text-white" x-text="mockCSP.email"></span></div>
                                            <div class="pt-2 mt-2 border-t border-gray-100 dark:border-gray-700 flex justify-between"><span class="text-gray-500">Assigned RM</span> <span class="font-medium text-gray-900 dark:text-white" x-text="mockCSP.rm"></span></div>
                                        </div>
                                    </div>

                                    <!-- Right Column: Document Selection -->
                                    <div class="lg:col-span-2 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 flex flex-col">
                                        <h3 class="font-semibold text-gray-900 dark:text-white mb-4 text-lg">Select Documents to Generate</h3>
                                        
                                        <div class="space-y-3 flex-grow">
                                            <template x-for="(doc, index) in documentTypes" :key="index">
                                                <label class="flex items-center p-4 border border-gray-200 dark:border-gray-700 rounded-lg cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors" :class="selectedDocs.includes(doc) ? 'border-eko bg-eko-light/30 dark:border-eko dark:bg-eko/10' : ''">
                                                    <input type="checkbox" :value="doc" x-model="selectedDocs" class="w-5 h-5 text-eko border-gray-300 rounded focus:ring-eko">
                                                    <span class="ml-3 font-medium text-gray-900 dark:text-white" x-text="doc"></span>
                                                    <i class="fas fa-file-alt ml-auto text-gray-400" :class="selectedDocs.includes(doc) ? 'text-eko' : ''"></i>
                                                </label>
                                            </template>
                                        </div>

                                        <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3">
                                            <button @click="rmStep = 'dashboard'; selectedDocs = []" class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                                            <button @click="startGeneration()" :disabled="selectedDocs.length === 0" :class="selectedDocs.length === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-eko-dark shadow-sm shadow-green-500/30'" class="px-6 py-2.5 bg-eko text-white font-medium rounded-lg transition-all flex items-center gap-2">
                                                <span>Generate Documents</span> <i class="fas fa-cogs"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Request History (Hidden when looking at specific search) -->
                            <div x-show="rmStep === 'dashboard'" class="mt-8">
                                <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Recent Requests</h3>
                                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left border-collapse">
                                            <thead>
                                                <tr class="bg-gray-50 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wider">
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700">CSP ID</th>
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700">CSP Name</th>
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700">Documents</th>
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700">Date</th>
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700">Status</th>
                                                    <th class="px-4 py-3 font-semibold border-b border-gray-200 dark:border-gray-700 text-right">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
                                                <template x-for="req in rmHistory" :key="req.id">
                                                    <tr class="hover:bg-gray-50 dark:hover:bg-gray-750 transition-colors group">
                                                        <td class="px-4 py-3 text-sm font-medium text-gray-900 dark:text-white" x-text="req.cspId"></td>
                                                        <td class="px-4 py-3 text-sm font-medium text-gray-900 dark:text-white" x-text="req.cspName"></td>
                                                        <td class="px-4 py-3 text-sm text-gray-600 dark:text-gray-300" x-text="req.docs"></td>
                                                        <td class="px-4 py-3 text-sm text-gray-600 dark:text-gray-300" x-text="req.date"></td>
                                                        <td class="px-4 py-3">
                                                            <span class="px-2.5 py-1 text-xs font-medium rounded-full inline-flex items-center gap-1.5"
                                                                  :class="{
                                                                      'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400 border border-green-200 dark:border-green-800': req.status === 'Sent',
                                                                      'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400 border border-red-200 dark:border-red-800': req.status === 'Failed',
                                                                      'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400 border border-yellow-200 dark:border-yellow-800': req.status === 'Waiting for Data'
                                                                  }">
                                                                <i class="fas text-[10px]" :class="{
                                                                    'fa-check-circle': req.status === 'Sent',
                                                                    'fa-times-circle': req.status === 'Failed',
                                                                    'fa-exclamation-triangle': req.status === 'Waiting for Data'
                                                                }"></i>
                                                                <span x-text="req.status"></span>
                                                            </span>
                                                        </td>
                                                        <td class="px-4 py-3 text-right">
                                                            <button class="text-gray-400 hover:text-eko transition-colors"><i class="fas fa-chevron-right"></i></button>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- State 2: Generating Progress -->
                        <div x-show="rmStep === 'generating'" x-transition x-cloak class="flex flex-col items-center justify-center py-20">

                rmAlerts: [
                    { id: 1, cspId: 'CSP100234', cspName: 'Demo Enterprises (Rajesh)', missing: 'Branch Code, CSP Photo', read: false },
                    { id: 2, cspId: 'CSP44012', cspName: 'Kisan Point', missing: 'Training Certificate Upload', read: false }
                ],
                get unreadAlerts() {
                    return this.rmAlerts.filter(a => !a.read).length;
                },

                // Admin State
                adminRoute: 'overview',
                adminDateFilter: 'today',
                adminCustomDate: '',
                drilldownType: 'requests',
                drilldownTitle: '',
                drilldownHideDocs: false,
                activeDocContext: null, // Stores document name when clicked from inside a doc section
                adminModalOpen: false,
                adminModalType: 'request',
                selectedRow: null,

                // Computed Dates
                get adminDateDisplay() {
                    if (this.adminDateFilter === 'custom') {
                        if (!this.adminCustomDate) return 'Selected Date';
                        const d = new Date(this.adminCustomDate);
                        return isNaN(d.getTime()) ? 'Selected Date' : d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                    }
                    const map = {
                        'today': 'Today',
                        'yesterday': 'Yesterday',
                        'this_week': 'This Week',
                        'this_month': 'This Month',
                        'this_year': 'This Year'
                    };
                    return map[this.adminDateFilter] || 'Today';
                },

                // Mock Data
                mockCSP: {
                    id: 'CSP100234',
                    name: 'Demo Enterprises (Rajesh Kumar)',
                    branch: 'Delhi NCR Main (DL-01)',
                    location: 'Connaught Place, New Delhi',
                    mobile: '+91 98765 43210',
                    email: 'rajesh.demo@example.com',
                    rm: 'Rahul Kumar'
                },

                rmHistory: [
                    { id: 'REQ-9921', cspId: 'CSP44201', cspName: 'Sharma Comms', docs: 'CSP ID CARD, BCP', date: 'Today, 10:45 AM', status: 'Sent' },
                    { id: 'REQ-9920', cspId: 'CSP88123', cspName: 'Gupta Traders', docs: 'TRAINING CERTIFICATE', date: 'Today, 09:12 AM', status: 'Failed' },
                    { id: 'REQ-9915', cspId: 'CSP100234', cspName: 'Demo Enterprises', docs: 'CSP ID CARD', date: 'Yesterday, 16:30 PM', status: 'Waiting for Data' }
                ],

                adminNewCspMetrics: [
                    { name: 'CSP ID CARD', generated: 140, failedGen: 2, sent: 138, failedSend: 2 },
                    { name: 'CSP CERTIFICATE', generated: 142, failedGen: 0, sent: 141, failedSend: 1 },
                    { name: 'TRAINING CERTIFICATE', generated: 135, failedGen: 7, sent: 130, failedSend: 5 },
                    { name: 'BUSINESS CONTINUITY PLAN', generated: 141, failedGen: 1, sent: 141, failedSend: 0 }
                ],
                
                adminOldCspMetrics: [
                    { name: 'CSP ID CARD', requested: 45, generated: 40, failedGen: 5, sent: 38, failedSend: 2 },
                    { name: 'CSP CERTIFICATE', requested: 20, generated: 20, failedGen: 0, sent: 19, failedSend: 1 },
                    { name: 'TRAINING CERTIFICATE', requested: 60, generated: 52, failedGen: 8, sent: 50, failedSend: 2 },
                    { name: 'BUSINESS CONTINUITY PLAN', requested: 15, generated: 12, failedGen: 3, sent: 12, failedSend: 0 }
                ],

                // Admin Table Default Data Lists
                adminTableData: [
                    { id: 'CSP100234', name: 'Demo Enterprises', rm: 'Rahul Kumar', docs: 'CSP ID CARD, BCP', date: 'Today, 10:45 AM', status: 'Generated' },
                    { id: 'CSP99211', name: 'Verma Kiosk', rm: 'Amit Singh', docs: 'CSP CERTIFICATE', date: 'Today, 09:12 AM', status: 'Generated' },
                    { id: 'CSP44012', name: 'Kisan Point', rm: 'Priya D', docs: 'TRAINING CERTIFICATE', date: 'Yesterday, 16:30 PM', status: 'Failed' },
                    { id: 'CSP11092', name: 'National CSC', rm: 'Rahul Kumar', docs: 'Multiple Documents', date: 'Oct 24, 2023', status: 'Missing Data' }
                ],

                totalCspData: [
                    { id: 'CSP100234', name: 'Demo Enterprises', date: 'Jan 15, 2023', rm: 'Rahul Kumar', state: 'Delhi', status: 'Active' },
                    { id: 'CSP99211', name: 'Verma Kiosk', date: 'Feb 20, 2023', rm: 'Amit Singh', state: 'Haryana', status: 'Active' }
                ],

                newCspData: [
                    { id: 'CSP125432', name: 'Mishra Electronics', date: 'Today, 08:30 AM', rm: 'Rahul Kumar', state: 'Delhi', status: 'Pending Docs' },
                    { id: 'CSP125433', name: 'A-One Services', date: 'Today, 09:15 AM', rm: 'Priya D', state: 'UP East', status: 'Pending Docs' }
                ],

                detailsFetchedData: [
                    { id: 'CSP125432', name: 'Mishra Electronics', fetchedCols: ['CSP ID', 'Name', 'Phone', 'Address', 'Branch Code', 'Photo'], readyDocs: ['CSP ID CARD', 'CSP CERTIFICATE', 'TRAINING CERTIFICATE', 'BUSINESS CONTINUITY PLAN'], rm: 'Rahul Kumar' }
                ],

                detailsNotFetchedData: [
                    { id: 'CSP125434', name: 'Tech Comms', missingCols: ['Branch Code', 'Photo'], blockedDocs: ['CSP ID CARD', 'BUSINESS CONTINUITY PLAN'], rm: 'Amit Singh' },
                    { id: 'CSP125436', name: 'Singh Point', missingCols: ['Photo'], blockedDocs: ['CSP ID CARD'], rm: 'Rahul Kumar' }
                ],

                // Dynamic drilldown computation
                get currentDrilldownData() {
                    if(this.drilldownType === 'total_csp') return this.totalCspData;
                    if(this.drilldownType === 'new_csp') return this.newCspData;
                    if(this.drilldownType === 'details_fetched') return this.detailsFetchedData;
                    if(this.drilldownType === 'details_not_fetched') return this.detailsNotFetchedData;
                    
                    // Fallback to requests data
                    let baseData = JSON.parse(JSON.stringify(this.adminTableData || [])); 
                    
                    // If a specific document is clicked, force that document context in the table
                    if(this.activeDocContext) {
                        return baseData.map(row => {
                            row.docs = this.activeDocContext;
                            return row;
                        });
                    }
                    
                    return baseData;
                },

                // Methods
                toggleTheme() {
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                },
                
                openAlert(alert) {
                    alert.read = true;
                    this.alertsMenu = false;
                    this.searchQuery = alert.cspId;
                    
                    // Set mock context for the alert
                    this.mockCSP.id = alert.cspId;
                    this.mockCSP.name = alert.cspName;
                    
                    // Pre-select required documents to show logic
                    this.selectedDocs = ['CSP ID CARD', 'BUSINESS CONTINUITY PLAN'];
                    
                    // Directly jump to missing data form
                    this.rmStep = 'missing_data';
                },

                login(role) {
                    this.currentRoute = role;
                    if(role === 'rm') this.rmStep = 'dashboard';
                    if(role === 'admin') this.adminRoute = 'overview';
                },

                logout() {
                    this.currentRoute = 'auth';
                    this.logoutMenu = false;
                    this.rmStep = 'dashboard';
                    this.selectedDocs = [];
                    this.searchQuery = '';
                },

                searchCSP() {
                    if(this.searchQuery.length > 3) {
                        this.rmStep = 'search_result';
                        this.selectedDocs = []; 
                    }
                },

                startGeneration() {
                    this.rmStep = 'generating';
                    this.genProgress = 0;
                    setTimeout(() => { this.genProgress = 1; }, 1200);
                    setTimeout(() => {
                        if(this.selectedDocs.includes('BUSINESS CONTINUITY PLAN') || this.selectedDocs.includes('CSP ID CARD')) {
                            this.rmStep = 'missing_data';
                        } else {
                            this.rmStep = 'validating';
                        }
                    }, 2500);
                },

                resumeGeneration() {
                    this.rmStep = 'generating';
                    this.genProgress = 1;
                    setTimeout(() => { this.rmStep = 'validating'; }, 1500);
                },

                sendEmail() {
                    setTimeout(() => {
                        this.rmStep = 'success';
                        this.rmHistory.unshift({
                            id: 'REQ-99' + Math.floor(Math.random() * 99),
                            cspId: this.mockCSP.id,
                            cspName: this.mockCSP.name.split(' (')[0],
                            docs: this.selectedDocs.length > 2 ? 'Multiple Documents' : this.selectedDocs.join(', '),
                            date: 'Just now',
                            status: 'Sent'
                        });
                    }, 800);
                },

                resetRM() {
                    this.rmStep = 'dashboard';
                    this.searchQuery = '';
                    this.selectedDocs = [];
                },

                handleNotificationClick(notif) {
                    notif.unread = false;
                    this.rmNotificationsOpen = false;
                    this.searchQuery = notif.cspId;
                    this.searchCSP();
                },

                // Modified to handle setting the active context so Document Columns hide when appropriate
                openDrilldown(type, title, hideDocs = false, docContext = null) {
                    this.drilldownType = type;
                    this.drilldownTitle = title;
                    this.drilldownHideDocs = hideDocs;
                    this.activeDocContext = docContext; 
                    this.adminRoute = 'drilldown';
                },

                openAdminModal(row, type) {
                    this.selectedRow = row;
                    this.adminModalType = type;
                    this.adminModalOpen = true;
                }
            }));
        });
    </script>
</body>
